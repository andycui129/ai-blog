<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能博客</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; background: #f8f9fa; color: #333; line-height: 1.8; }
  header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 60px 20px; text-align: center; }
  header h1 { font-size: 2.5em; margin-bottom: 10px; }
  header p { font-size: 1.2em; opacity: 0.9; }
  .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
  .article { background: white; border-radius: 12px; padding: 30px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .article h2 { font-size: 1.5em; margin-bottom: 10px; }
  .article h2 a { color: #333; text-decoration: none; }
  .article h2 a:hover { color: #667eea; }
  .article .meta { color: #999; font-size: 0.9em; margin-bottom: 15px; }
  .article .summary { color: #555; }
  footer { text-align: center; padding: 40px; color: #999; font-size: 0.9em; }
</style>
</head>
<body>
<header>
  <h1>🤖 AI 智能博客</h1>
  <p>每日 AI 前沿资讯 · 自动生成 · 持续更新</p>
</header>
<div class="container">
  <div class="article">
    <h2><a href="#">🚀 博客即将上线</a></h2>
    <div class="meta">2026-07-27</div>
    <div class="summary">第一篇 AI 自动生成的文章即将发布，敬请期待！本站内容涵盖人工智能最新动态、深度分析和实用教程。</div>
  </div>
</div>
<footer>
  <p>Powered by Hermes AI · 全自动内容生成</p>
</footer>
</body>
</html>
